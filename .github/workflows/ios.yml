name: iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned IPA
        run: npm run ios:package

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: jueliu-ios-ipa
          path: release-local/*.ipa
          if-no-files-found: error
          retention-days: 30
