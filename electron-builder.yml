appId: com.5044.jueliu
productName: 掘流
copyright: Copyright © 2026 掘流

directories:
  output: release
  buildResources: build-resources

npmRebuild: false
asar: true
# 使用本地已下载的 Electron 二进制，避免打包时联网下载。
electronDist: node_modules/electron/dist

files:
  - electron/**/*
  - .next/standalone/**/*
  - package.json
  - "!node_modules"

extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
  - from: public/appicon.png
    to: appicon.png

asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - ".next/standalone/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.ico
  artifactName: Jueliu-Setup-${version}.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 掘流
