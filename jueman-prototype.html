<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>掘漫 jueman · 交互原型</title>
<style>
  :root{
    --bg:#ffffff; --fg:#18181b; --card:#ffffff; --muted:#f4f4f5; --muted-fg:#71717a;
    --border:#e4e4e7; --input:#e4e4e7; --primary:#18181b; --primary-fg:#fafafa;
    --accent:#f4f4f5; --accent-fg:#18181b; --ring:#a1a1aa; --destructive:#dc2626;
    --radius:12px; --radius-sm:8px; --radius-lg:16px; --radius-xl:20px;
    --lilac:#c5b0f4; --lime:#dceeb1; --cream:#f4ecd6; --mint:#c8e6cd; --pink:#efd4d4; --coral:#f3c9b6;
    --amber:#b45309; --amber-bg:rgba(245,158,11,.12); --amber-bd:rgba(245,158,11,.4);
    --green:#059669; --green-bg:rgba(16,185,129,.12); --green-bd:rgba(16,185,129,.35);
    --blue:#2563eb;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  }
  *{box-sizing:border-box; border-color:var(--border);}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
       -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#d4d4d8;border:3px solid #fff;border-radius:8px;}

  /* ---------- layout ---------- */
  .topbar{position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:1200px; margin:0 auto; height:56px; display:flex; align-items:center;
                justify-content:space-between; gap:16px; padding:0 16px;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px;}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--fg);color:#fff;
               display:flex;align-items:center;justify-content:center;}
  .nav{display:flex; align-items:center; gap:4px;}
  .nav a{position:relative; display:flex; align-items:center; gap:6px; padding:6px 12px;
         border-radius:999px; font-size:13px; font-weight:500; color:var(--muted-fg);}
  .nav a:hover{background:var(--accent); color:var(--fg);}
  .nav a.active{background:var(--primary); color:var(--primary-fg);}
  .nav .pill-badge{margin-left:2px; background:#fff; color:var(--fg); border-radius:999px;
                   min-width:16px; height:16px; padding:0 4px; font-size:10px; display:inline-flex;
                   align-items:center; justify-content:center; font-weight:600;}
  .main{max-width:1200px; margin:0 auto; padding:24px 16px 64px;}
  .row{display:flex;} .col{display:flex;flex-direction:column;}
  .wrap{flex-wrap:wrap;} .between{justify-content:space-between;} .center{align-items:center;}
  .g2{gap:8px;} .g3{gap:12px;} .g4{gap:16px;} .g6{gap:24px;}
  .grow{flex:1;}

  /* ---------- typography ---------- */
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted-fg);}
  .muted{color:var(--muted-fg);}
  h1.t{font-size:26px; font-weight:300; letter-spacing:-.5px; margin:0;}
  .sub{max-width:640px; font-size:14px; line-height:1.65; color:var(--muted-fg);}
  .mono{font-family:var(--mono);}

  /* ---------- primitives ---------- */
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);}
  .card-pad{padding:16px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px;
       padding:0 14px; border-radius:10px; border:1px solid transparent; background:var(--primary);
       color:var(--primary-fg); font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;}
  .btn:hover{opacity:.9;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.outline{background:transparent; color:var(--fg); border-color:var(--border);}
  .btn.outline:hover{background:var(--accent);}
  .btn.ghost{background:transparent; color:var(--fg);}
  .btn.ghost:hover{background:var(--accent);}
  .btn.sm{height:30px; padding:0 10px; font-size:12px; border-radius:8px;}
  .btn.xs{height:26px; padding:0 8px; font-size:12px; border-radius:7px; gap:4px;}
  .btn.danger{background:var(--destructive); color:#fff;}
  .btn .sp{width:14px;height:14px;flex:0 0 auto;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
            border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted-fg);}
  .icon-btn:hover{background:var(--accent);color:var(--fg);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
         font-size:11px;font-weight:500;background:var(--muted);color:var(--fg);border:1px solid transparent;}
  .badge.outline{background:transparent;border-color:var(--border);color:var(--muted-fg);}
  .badge.ok{background:var(--green-bg);color:var(--green);}
  .badge.warn{background:var(--amber-bg);color:var(--amber);}
  .badge.live{background:var(--blue);color:#fff;}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .input,select.input,textarea.input{width:100%;height:36px;padding:0 12px;border-radius:10px;
        border:1px solid var(--input);background:transparent;font-size:13px;color:var(--fg);outline:none;}
  textarea.input{height:auto;padding:10px 12px;line-height:1.6;resize:vertical;}
  .input:focus{border-color:var(--ring);box-shadow:0 0 0 3px rgba(161,161,170,.25);}
  .label{font-size:12px;font-weight:500;color:var(--fg);}
  .sep{height:1px;background:var(--border);border:0;margin:0;}

  /* ---------- header cloud status ---------- */
  .cloudchip{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
             border:1px solid var(--border);font-size:12px;color:var(--muted-fg);cursor:pointer;}
  .cloudchip:hover{background:var(--accent);}
  .cloudchip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg);}
  .cloudchip.off .dot{background:var(--muted-fg);box-shadow:none;}

  /* ---------- home ---------- */
  .home{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px;}
  .hero{padding-top:24px;display:flex;flex-direction:column;gap:20px;}
  .hero h1{font-size:44px;font-weight:300;line-height:1.08;letter-spacing:-1px;margin:0;max-width:760px;}
  .hero p{font-size:17px;line-height:1.6;max-width:660px;}
  .block{border-radius:24px;padding:40px;}
  .block .eyebrow{color:rgba(0,0,0,.55);}
  .block h2{font-size:24px;font-weight:500;letter-spacing:-.3px;margin:14px 0 0;}
  .block p{font-size:16px;line-height:1.6;}
  .mini-grid{display:grid;gap:14px;margin-top:26px;}
  .mini{background:rgba(255,255,255,.7);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;}
  .mini .ic{width:36px;height:36px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;}
  .step-num{width:34px;height:34px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;
            justify-content:center;font-weight:500;flex:0 0 auto;}

  /* ---------- projects ---------- */
  .p-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
  .pill-link{border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--muted-fg);}
  .pill-link:hover{background:var(--muted);color:var(--fg);}

  /* ---------- episode tabs ---------- */
  .tabs{display:inline-flex;gap:4px;background:var(--muted);padding:4px;border-radius:999px;}
  .tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-size:13px;
               font-weight:500;color:var(--muted-fg);cursor:pointer;}
  .tabs button.active{background:var(--primary);color:var(--primary-fg);}
  .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-fg);}
  .crumb a:hover{color:var(--fg);}

  /* ---------- storyboard ---------- */
  .banner{border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-wrap:wrap;
          align-items:flex-start;justify-content:space-between;gap:12px;}
  .shot{border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px;}
  .refimg{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#c5b0f4,#8b5cf6);flex:0 0 auto;}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;}
  .thumb{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--border);
         display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;}
  .thumb .tag{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.7);color:#fff;border-radius:4px;
              padding:0 4px;font-size:10px;line-height:16px;}
  .screen{position:relative;border-radius:10px;background:#0b0b0c;display:flex;align-items:center;
          justify-content:center;overflow:hidden;color:#71717a;}

  .seg-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;}
  .seg-card{width:176px;flex:0 0 auto;border:1px solid var(--border);border-radius:10px;padding:8px;
            cursor:pointer;display:flex;flex-direction:column;gap:6px;background:#fff;}
  .seg-card:hover{background:var(--muted);}
  .seg-card.active{border-color:rgba(24,24,27,.4);background:var(--muted);}
  .seg-thumb{aspect-ratio:16/9;border-radius:7px;background:#0b0b0c;position:relative;overflow:hidden;
             display:flex;align-items:center;justify-content:center;color:#52525b;}

  .sticky-strip{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);
                margin:0 -16px -64px;padding:12px 16px 16px;z-index:30;}

  /* progress */
  .bar{height:6px;border-radius:999px;background:var(--muted);overflow:hidden;}
  .bar > i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .35s ease;}
  .bar.done > i{background:var(--green);}
  .spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--fg);
           border-radius:50%;animation:spin .7s linear infinite;}
  .spinner.light{border-color:rgba(255,255,255,.35);border-top-color:#fff;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pulse{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  /* workbench */
  .stat{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;
        flex-direction:column;gap:4px;background:#fff;}
  .stat .k{font-size:12px;color:var(--muted-fg);}
  .stat .v{font-size:24px;font-weight:300;letter-spacing:-.5px;}
  .job{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--border);
       border-radius:10px;padding:12px 14px;background:#fff;align-items:center;}
  .job .title{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;}
  .gauge{width:120px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted-fg);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(9,9,11,.45);z-index:100;display:flex;
           align-items:center;justify-content:center;padding:20px;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:760px;max-height:92vh;
         display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25);}
  .modal-head{padding:18px 20px 12px;border-bottom:1px solid var(--border);}
  .modal-body{padding:18px 20px;overflow-y:auto;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

  /* toast */
  .toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{background:#18181b;color:#fafafa;border-radius:12px;padding:12px 14px;font-size:13px;
         max-width:340px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start;
         animation:rise .2s ease;}
  .toast.ok{background:#065f46;} .toast.err{background:#7f1d1d;}
  .toast .tt{font-weight:600;} .toast .ts{opacity:.8;font-size:12px;}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

  .infer{background:var(--blue) !important;}
  .subtabs{display:inline-flex;gap:4px;background:var(--muted);border-radius:10px;padding:3px;}
  .subtabs button{border:0;background:transparent;padding:5px 12px;border-radius:8px;font-size:12px;
                  font-weight:500;color:var(--muted-fg);cursor:pointer;}
  .subtabs button.active{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .warnbox{border:1px solid var(--amber-bd);background:var(--amber-bg);color:var(--amber);
           border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;}
  .empty{border:1px dashed var(--border);border-radius:10px;color:var(--muted-fg);font-size:13px;
         text-align:center;padding:28px;}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .kv:last-child{border-bottom:0;}
  .kv .k{color:var(--muted-fg);}
  .codebox{font-family:var(--mono);font-size:12px;line-height:1.7;background:var(--muted);
           border:1px solid var(--border);border-radius:10px;padding:12px;white-space:pre-wrap;max-height:220px;overflow:auto;}
  @media (max-width:760px){ .hero h1{font-size:32px;} .block{padding:26px;} .nav .lbl{display:none;} }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#" data-nav="home">
      <span class="logo" id="brandIcon"></span>
      <span>掘漫</span>
      <span class="badge outline" style="margin-left:2px">完整版</span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="row center g2">
      <div class="cloudchip" id="cloudChip" data-nav="workbench">
        <span class="dot"></span><span id="cloudChipText">云端在线</span>
      </div>
      <span class="badge ok" title="激活码产品字段：product=jueliu-full">已激活</span>
    </div>
  </div>
</header>

<main class="main" id="app"></main>
<div id="modal-root"></div>
<div class="toasts" id="toast-root"></div>

<script>

   与掘流的差别：内置云端生成（ComfyUI / MiniMax H3）+ 工作台 + 云端连接管理

/* ---------------- icons ---------------- */

function svg(name, cls){ return '<svg class="'+(cls||'sp')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+I[name]+'</svg>'; }

document.getElementById('brandIcon').innerHTML = icon('film',15);

/* ---------------- state ---------------- */
const state = {
  route:'home',
  episodeTab:'storyboard',

  cloud:{

const SERIES = [

      {id:'e1',name:'第1集'},{id:'e2',name:'第2集'},{id:'e3',name:'第3集'}] },
  { id:'s2', name:'雨夜重逢', createdAt:'2026-10-08 10:02', episodes:[{id:'e1',name:'第1集'}] },

const episode = {

/* ---------------- helpers ---------------- */
const $ = (s,root)=> (root||document).querySelector(s);
const $$ = (s,root)=> Array.from((root||document).querySelectorAll(s));
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pad(n){ return n<10?'0'+n:''+n; }
function nowTime(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function allSegments(){ return episode.scenes.flatMap(sc=>sc.segments.map(s=>({scene:sc, seg:s}))); }
function segById(id){ const e=allSegments().find(x=>x.seg.id===id); return e?e.seg:null; }
function jobOf(segId){ return state.jobs.find(j=>j.segId===segId && (j.status==='queued'||j.status==='running')); }
function activeJobs(){ return state.jobs.filter(j=>j.status==='running'||j.status==='queued'); }

function toast(title, sub, type){
  const el=document.createElement('div');
  el.className='toast'+(type==='ok'?' ok':type==='err'?' err':'');
  const icName = type==='ok'?'check' : type==='err'?'alert' : 'bolt';
  el.innerHTML='<span style="margin-top:1px;display:flex">'+icon(icName,16)+'</span>'+
    '<div><div class="tt">'+esc(title)+'</div>'+(sub?'<div class="ts">'+esc(sub)+'</div>':'')+'</div>';
  $('#toast-root').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateY(6px)';
    setTimeout(()=>el.remove(),300); }, 4200);
}

/* ---------------- nav ---------------- */
const NAV=[
  {k:'home',label:'首页',icon:'home'},
  {k:'projects',label:'项目',icon:'grid'},
  {k:'library',label:'资源库',icon:'book'},
  {k:'workbench',label:'工作台',icon:'bolt',badge:()=>activeJobs().length},
  {k:'settings',label:'设置',icon:'settings'},
];
function renderNav(){
  $('#nav').innerHTML = NAV.map(n=>{
    const badge = n.badge && n.badge()>0 ? '<span class="pill-badge">'+n.badge()+'</span>' : '';
    return '<a href="#" data-nav="'+n.k+'" class="'+(state.route===n.k?'active':'')+'">'+svg(n.icon,'sp')+
      '<span class="lbl">'+n.label+'</span>'+badge+'</a>';
  }).join('');
  const chip=$('#cloudChip');
  chip.classList.toggle('off', !state.cloud.connected);
  $('#cloudChipText').textContent = state.cloud.connected ? ('云端在线 · '+(activeJobs().length?activeJobs().length+' 任务':'空闲')) : '云端未连接';
}

/* ---------------- router ---------------- */
function go(route, opts){
  state.route=route; if(opts&&opts.tab) state.episodeTab=opts.tab;
  render();
  window.scrollTo({top:0});
}
function render(){
  renderNav();
  const app=$('#app');
  if(state.route==='home') app.innerHTML=viewHome();
  else if(state.route==='projects') app.innerHTML=viewProjects();
  else if(state.route==='episode') app.innerHTML=viewEpisode();
  else if(state.route==='library') app.innerHTML=viewLibrary();
  else if(state.route==='workbench') app.innerHTML=viewWorkbench();
  else if(state.route==='settings') app.innerHTML=viewSettings();
}

    return `<div class="screen" style="aspect-ratio:9/16;background:linear-gradient(160deg,#1e1b4b,#0ea5e9)">

    return `<div class="screen" style="aspect-ratio:9/16">
      <div class="col center" style="gap:12px;width:70%">
        <span class="spinner light" style="width:26px;height:26px;border-width:3px"></span>
        <div style="width:100%"><div class="bar" style="background:rgba(255,255,255,.18)"><i class="infer" style="width:${job.progress}%"></i></div></div>
        <span style="font-size:12px;color:#a1a1aa">${job.status==='queued'?'排队中…':'云端生成中'} ${job.progress}%</span>
      </div>
    </div>`;

function statCard(k,v,tone){
  return `<div class="stat"><span class="k">${k}</span>
    <span class="v" style="color:${tone==='ok'?'var(--green)':tone==='warn'?'var(--amber)':tone==='live'?'var(--blue)':'var(--fg)'}">${esc(v)}</span></div>`;
}
function kv(k,v){ return `<div class="kv"><span class="k">${k}</span><span>${esc(v)}</span></div>`; }
function jobRow(j){
  const tone={running:'live',queued:'warn',done:'ok',failed:'warn'}[j.status];
  const eta = j.status==='running' ? '· 剩余约 '+Math.max(1,Math.round((j.durMs*(100-j.progress)/100)/1000))+'s' : '';
  return `<div class="job">
    <div class="col g2" style="gap:6px">
      <div class="title">
        <span class="badge ${tone==='live'?'live':tone==='ok'?'ok':tone==='warn'?'warn':'outline'}">${
          j.status==='running'?'生成中':j.status==='queued'?'排队中':j.status==='done'?'已完成':'失败'}</span>
        ${esc(j.label)}
        <span class="muted mono" style="font-size:11px">${j.id}</span>
      </div>
      <div class="bar ${j.status==='done'?'done':''}"><i style="width:${j.progress}%"></i></div>
    </div>
    <div class="gauge">${j.progress}% ${eta}<br><span style="font-size:11px">${j.status==='running'?'开始于 '+j.startedAt:(j.status==='done'?'完成于 '+j.startedAt:'等待调度')}</span></div>
  </div>`;
}

/* ---------------- job engine ---------------- */
function submitGen(segId){
  const seg=segById(segId);
  if(jobOf(segId)) { toast('该段已在队列中'); return; }
  if(!state.cloud.connected){ toast('云端未连接','请先配置云端算力','err'); return; }
  const label='生成 · '+seg.label;
  const job={ id:'job-'+(++state.jobSeq)+'-'+(9000+state.jobSeq),
    segId, label, kind:'gen-video', status:'queued', progress:0,
    startedAt:nowTime(), durMs:16000+Math.round(Math.random()*8000) };
  state.jobs.unshift(job);
  toast('已提交到云端算力','任务 ' + job.id, 'ok');
  ensureTicker();
  closeModal();
  render();
}
function ensureTicker(){ if(state._tick) return; state._tick=setInterval(tick,400); }
function tick(){
  const running=state.jobs.filter(j=>j.status==='running');
  const queued=state.jobs.filter(j=>j.status==='queued');
  if(running.length<state.cloud.concurrency && queued.length){
    const j=queued[0]; j.status='running'; j.startedAt=nowTime();
    toast('开始生成 · '+ (segById(j.segId)?.label||''), j.id);
    renderNav();
    if(state.route==='workbench'||state.route==='episode') render();
  }
  let changed=false;
  running.forEach(j=>{
    j.progress=Math.min(100, j.progress + 4 + Math.round(Math.random()*8));
    if(j.progress>=100){ j.status='done'; j.progress=100; changed=true;
      const seg=segById(j.segId); if(seg) seg.video=true;
      toast('生成完成 · '+(seg?seg.label:''), '已回填 video_path', 'ok');
    }
  });
  renderNav();
  if(state.route==='workbench') render();
  else if(state.route==='episode' && state.episodeTab==='storyboard' && (changed||running.length)) render();
  if(!activeJobs().length){ clearInterval(state._tick); state._tick=null; if(state.route==='workbench'||state.route==='episode') render(); }
}
function batchGen(){
  if(!state.cloud.connected){ toast('云端未连接','请先配置','err'); return; }
  const pending=allSegments().filter(x=>!x.seg.video && !jobOf(x.seg.id));
  pending.forEach(x=> submitGen(x.seg.id));
  if(pending.length) toast('已批量提交 '+pending.length+' 段','完成后自动回填分镜','ok');
  else toast('没有待生成的段落');
}

/* ---------------- modal ---------------- */
function closeModal(){ $('#modal-root').innerHTML=''; }

/* ---------------- events ---------------- */
document.addEventListener('click',(e)=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){ e.preventDefault(); go(nav.dataset.nav); return; }
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='close-modal'){
      const box=e.target.closest('[data-stop]');
      const hitClose=e.target.closest('[data-act="close-modal"]');
      if(box && (!hitClose || hitClose.classList.contains('overlay'))) return;
      closeModal(); return;
    }
    if(a==='ep-tab'){ state.episodeTab=act.dataset.tab; render(); return; }
    if(a==='pick-seg'){ state.previewSeg=act.dataset.seg; render(); return; }
    if(a==='open-gen'){ openGenModal(act.dataset.seg); return; }
    if(a==='gen-tab'){ 
      $$('#gen-tabs button').forEach(b=>b.classList.toggle('active',b===act)); 
      const mid=state.modalSeg||state.previewSeg;
      const seg=segById(mid); const list=allSegments();
      renderGenPane(seg, list.find(x=>x.seg.id===mid), act.dataset.t); return; }
    if(a==='submit-gen'){ submitGen(act.dataset.seg); return; }
    if(a==='jump-workbench'){ closeModal(); go('workbench'); return; }
    if(a==='move-sb'){ state.episodeTab='storyboard'; render(); return; }
    if(a==='batch-gen'){ batchGen(); return; }
    if(a==='pause-all'){ toast('已暂停队列','（原型示意）'); return; }
    if(a==='re-orchestrate'){ toast('已按引擎重新编排分镜','重新打包段落（原型示意）','ok'); return; }
    if(a==='upload-video'){ toast('选择视频文件后回传','（原型示意）'); return; }
    if(a==='test-cloud'){ toast('连接成功','MiniMax H3 极速版 · RTX 4090 24G 就绪','ok'); return; }
    if(a==='save-cloud'){ state.cloud.baseUrl=$('#set-url').value.trim(); state.cloud.token=$('#set-token').value.trim()||state.cloud.token; toast('云端设置已保存','','ok'); render(); return; }
    if(a==='toggle-cloud'){ state.cloud.connected=!state.cloud.connected;
      toast(state.cloud.connected?'已连接云端':'已断开云端', state.cloud.connected?state.cloud.engine:'', state.cloud.connected?'ok':''); render(); return; }
    if(a==='save-llm'){ toast('已保存','','ok'); return; }
    if(a==='toggle-autoprompt'){ state.settings.autoPrompt=act.checked; return; }
    if(a==='new-project'){ SERIES.unshift({id:'s'+(SERIES.length+1),name:'未命名项目',createdAt:'刚刚',episodes:[]}); toast('项目已创建','','ok'); render(); return; }
    if(a==='open-project'){ toast('打开项目', '原型中固定在示例剧集'); go('episode',{tab:'storyboard'}); return; }
    if(a==='copy-project'){ toast('已复制项目','','ok'); return; }
    if(a==='del-project'){ toast('已删除（原型示意）'); return; }
    if(a==='skill'){ toast('技能运行中：'+act.dataset.skill,'可切换页面，完成后自动刷新'); return; }
    if(a==='copy'){ toast('已复制','','ok'); return; }
    return;
  }
});
function currentModalSeg(){
  const b=$('#gen-foot [data-seg]'); return b?b.dataset.seg:state.previewSeg;
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ---------------- boot ---------------- */
render();
