<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>掘漫 · 分镜「生成 / 预览」原型</title>
<style>
  :root{
    --bg:#ffffff; --fg:#18181b; --card:#ffffff; --muted:#f4f4f5; --muted-fg:#71717a;
    --border:#e4e4e7; --input:#e4e4e7; --primary:#18181b; --primary-fg:#fafafa;
    --accent:#f4f4f5; --ring:#a1a1aa; --destructive:#dc2626;
    --radius:12px; --radius-sm:8px; --radius-lg:16px;
    --mint:#c8e6cd; --cream:#f4ecd6;
    --amber:#b45309; --amber-bg:rgba(245,158,11,.12); --amber-bd:rgba(245,158,11,.4);
    --green:#059669; --green-bg:rgba(16,185,129,.12); --green-bd:rgba(16,185,129,.35);
    --blue:#2563eb; --blue-bg:rgba(37,99,235,.08);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  }
  *{box-sizing:border-box; border-color:var(--border);}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font);
       -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#d4d4d8;border:3px solid #fff;border-radius:8px;}
  svg.ic{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
         stroke-linecap:round;stroke-linejoin:round;}
  svg.ic.sm{width:13px;height:13px;}

  /* shell */
  .topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:1240px;margin:0 auto;height:56px;display:flex;align-items:center;
                justify-content:space-between;gap:16px;padding:0 16px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:var(--fg);color:#fff;
               display:flex;align-items:center;justify-content:center;font-size:13px;}
  .nav{display:flex;align-items:center;gap:4px;}
  .nav a{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
         font-size:13px;font-weight:500;color:var(--muted-fg);text-decoration:none;}
  .nav a:hover{background:var(--accent);color:var(--fg);}
  .nav a.active{background:var(--primary);color:var(--primary-fg);}
  .main{max-width:1240px;margin:0 auto;padding:20px 16px 72px;}
  .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-fg);margin-bottom:12px;}
  .crumb a{color:inherit;text-decoration:none;} .crumb a:hover{color:var(--fg);}
  .crumb .proto{margin-left:auto;border:1px dashed var(--border);border-radius:999px;padding:2px 9px;
                font-size:11px;color:var(--muted-fg);background:#fafafa;}
  .tabs{display:inline-flex;gap:4px;background:var(--muted);padding:4px;border-radius:999px;margin-bottom:16px;}
  .tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-size:13px;
               font-weight:500;color:var(--muted-fg);cursor:pointer;}
  .tabs button.active{background:var(--primary);color:var(--primary-fg);}

  /* primitives */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;
       padding:0 14px;border-radius:10px;border:1px solid transparent;background:var(--primary);
       color:var(--primary-fg);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;}
  .btn:hover{opacity:.9;} .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.outline{background:transparent;color:var(--fg);border-color:var(--border);}
  .btn.outline:hover{background:var(--accent);}
  .btn.ghost{background:transparent;color:var(--fg);}
  .btn.ghost:hover{background:var(--accent);}
  .btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px;}
  .btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:7px;gap:4px;}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
            border-radius:9px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--fg);}
  .icon-btn:hover{background:var(--accent);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
         font-size:11px;font-weight:500;background:var(--muted);color:var(--fg);border:1px solid transparent;}
  .badge.outline{background:transparent;border-color:var(--border);color:var(--muted-fg);}
  .badge.ok{background:var(--green-bg);color:var(--green);}
  .badge.warn{background:var(--amber-bg);color:var(--amber);}
  .badge.live{background:var(--blue-bg);color:var(--blue);}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .muted{color:var(--muted-fg);}
  .mono{font-family:var(--mono);}
  .row{display:flex;align-items:center;gap:8px;}
  .col{display:flex;flex-direction:column;gap:8px;}
  .grow{flex:1;}
  .hint-text{font-size:11.5px;color:var(--muted-fg);}

  /* banner */
  .banner{border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-wrap:wrap;
          align-items:flex-start;justify-content:space-between;gap:14px;background:var(--mint);}
  .banner h2{margin:0;font-size:16px;font-weight:600;}
  .banner p{margin:4px 0 0;font-size:13px;color:#3f4a41;}
  .banner .qc{margin-top:6px;font-size:11.5px;color:#4b5a4f;}
  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .vendor-chip{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid rgba(0,0,0,.12);
               border-radius:999px;background:rgba(255,255,255,.75);font-size:13px;cursor:pointer;}
  .vendor-chip:hover{background:#fff;}
  .vendor-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg);}

  /* sub tabs */
  .subtabs-wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .subtabs{display:inline-flex;gap:4px;background:var(--muted);padding:4px;border-radius:999px;}
  .subtabs button{display:flex;align-items:center;gap:6px;border:0;background:transparent;
                  padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted-fg);cursor:pointer;}
  .subtabs button.active{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .subtabs .count{font-size:11px;font-weight:400;color:var(--muted-fg);}
  .subtabs button.active .count{color:var(--fg);}
  .subtabs-help{font-size:11.5px;color:var(--muted-fg);}

  /* generate composer */
  .gen-wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px;width:100%;}
  .editor-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 4px;}
  .seg-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;
            border:1px solid var(--border);border-radius:999px;background:#fff;font-size:12.5px;
            font-weight:500;cursor:pointer;color:var(--fg);}
  .seg-chip:hover{border-color:#c9c9cf;background:#fafafa;}
  .editor-meta{font-size:12px;color:var(--muted-fg);}
  .editor-top .spacer{flex:1;}
  .final-tag{background:var(--blue-bg);color:var(--blue);border-color:rgba(37,99,235,.15);}

  .composer{background:#fafafa;border:1px solid #ececef;border-radius:20px;padding:14px 16px 12px;
            box-shadow:0 1px 2px rgba(0,0,0,.02);}
  .refs{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .ref{position:relative;width:62px;height:62px;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,.08);
       flex:0 0 auto;cursor:zoom-in;transition:transform .15s;}
  .ref:hover{transform:translateY(-1px);}
  .ref .ph{position:absolute;inset:0;}
  .ref .num{position:absolute;left:5px;bottom:5px;min-width:16px;height:16px;padding:0 4px;border-radius:5px;
            background:rgba(0,0,0,.66);color:#fff;font-size:10px;line-height:16px;text-align:center;font-family:var(--mono);}
  .ref .del{position:absolute;right:4px;top:4px;width:19px;height:19px;border-radius:50%;border:0;
            background:rgba(0,0,0,.52);color:#fff;font-size:12px;line-height:19px;text-align:center;
            cursor:pointer;padding:0;opacity:0;transition:opacity .15s,background .15s;}
  .ref:hover .del{opacity:1;}
  .ref .del:hover{background:var(--destructive);}
  .addref{width:62px;height:62px;flex:0 0 auto;border-radius:12px;border:1px dashed #d4d4d8;background:#fff;
          color:#71717a;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
          transition:background .15s,border-color .15s,color .15s;}
  .addref:hover{border-color:#a1a1aa;color:var(--fg);background:#f4f4f5;}
  .refs-note{margin-left:2px;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted-fg);}
  .refs-note b{font-size:11px;font-weight:500;color:#52525b;}

  .clip-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 2px 4px;
             font-size:13px;color:#3f3f46;}
  .clip-line .time{font-family:var(--mono);font-size:12.5px;color:#52525b;}
  .clip-line .divider{color:#d4d4d8;}
  .clip-line strong{font-weight:600;color:var(--fg);}

  #promptInput{display:block;width:100%;min-height:168px;max-height:420px;border:0;outline:none;resize:vertical;
               background:transparent;color:#27272a;font-family:var(--font);font-size:14px;line-height:1.95;
               padding:8px 2px 10px;}
  #promptInput::placeholder{color:#a1a1aa;}

  .composer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
                 border-top:1px solid #ededf0;padding-top:11px;margin-top:2px;}
  .params{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .param{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;
         border:1px solid #e4e4e7;background:#fff;color:#3f3f46;font-size:12.5px;cursor:pointer;
         transition:border-color .15s,background .15s;}
  .param:hover{border-color:#c9c9cf;background:#fff;}
  .param .caret{color:#a1a1aa;}
  .param .dot-ok{width:5px;height:5px;border-radius:50%;background:var(--green);}
  .send-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .restore{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;
           border:1px solid transparent;background:transparent;color:#52525b;font-size:12px;cursor:pointer;}
  .restore:hover{background:#fff;border-color:#e4e4e7;color:var(--fg);}
  .restore:disabled{opacity:.38;cursor:not-allowed;background:transparent;border-color:transparent;}
  .restore.dirty{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd);}
  .send{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;min-width:96px;
        padding:0 16px;border-radius:999px;border:0;background:var(--primary);color:#fff;
        font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,transform .1s;}
  .send:hover{background:#27272a;}
  .send:active{transform:scale(.985);}
  .send:disabled{opacity:.6;cursor:default;}
  .send .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
                 border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .composer-hint{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
                 padding:0 6px;font-size:11.5px;color:var(--muted-fg);}
  .kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;
       padding:0 4px;font-size:10.5px;line-height:16px;font-family:var(--mono);background:#fff;color:#52525b;}
  .submit-line{display:none;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;
               background:#fff;padding:9px 12px;font-size:12px;color:#52525b;}
  .submit-line.show{display:flex;}
  .submit-line .status-dot{width:7px;height:7px;border-radius:50%;background:var(--muted-fg);flex:0 0 auto;}
  .submit-line.running .status-dot{background:var(--blue);animation:pulse 1.2s infinite;}
  .submit-line.done .status-dot{background:var(--green);}
  .submit-line.warn{border-color:var(--amber-bd);background:var(--amber-bg);color:var(--amber);}
  .submit-line.warn .status-dot{background:var(--amber);}
  @keyframes pulse{50%{opacity:.35;}}
  .submit-line .spacer{flex:1;}

  /* popover */
  .popover{position:fixed;z-index:200;min-width:210px;max-width:290px;background:#fff;border:1px solid var(--border);
           border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.14);padding:6px;animation:fade .12s ease-out;}
  @keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}
  .pop-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 7px;
          font-size:11.5px;color:var(--muted-fg);}
  .pop-hd b{font-size:12px;color:var(--fg);font-weight:600;}
  .pop-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;border-radius:8px;
            background:transparent;font-size:12.5px;color:var(--fg);cursor:pointer;text-align:left;}
  .pop-item:hover{background:var(--muted);}
  .pop-item .sub{display:block;font-size:11px;color:var(--muted-fg);margin-top:1px;}
  .pop-item .check{margin-left:auto;color:var(--fg);}
  .pop-item .mini-thumb{width:28px;height:28px;border-radius:6px;flex:0 0 auto;border:1px solid rgba(0,0,0,.08);}
  .pop-sep{height:1px;background:var(--border);margin:5px 4px;}
  .pop-note{padding:5px 9px 7px;font-size:11px;line-height:1.5;color:var(--muted-fg);}
  .pop-foot{padding:5px 4px 3px;border-top:1px solid var(--border);margin-top:4px;}

  /* preview */
  .pv-panel{display:flex;flex-direction:column;gap:12px;}
  .strip-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 2px;}
  .strip-head b{font-size:13px;font-weight:600;}
  .strip-head .hint-text{margin-left:auto;}
  .seg-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;}
  .seg-card{width:184px;flex:0 0 auto;border:1px solid var(--border);border-radius:10px;padding:7px;
            cursor:pointer;display:flex;flex-direction:column;gap:6px;background:#fff;
            transition:background .15s,border-color .15s;}
  .seg-card:hover{background:#fafafa;}
  .seg-card.active{border-color:rgba(24,24,27,.4);background:#fafafa;box-shadow:0 0 0 1px rgba(24,24,27,.12) inset;}
  .seg-thumb{position:relative;aspect-ratio:16/9;border-radius:7px;overflow:hidden;background:#0b0b0c;
             display:flex;align-items:center;justify-content:center;color:#a1a1aa;}
  .seg-thumb .grad{position:absolute;inset:0;}
  .seg-thumb .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.4));}
  .seg-thumb .state{position:absolute;left:5px;top:5px;border-radius:4px;padding:0 5px;font-size:10px;
                    line-height:16px;color:#fff;background:rgba(0,0,0,.62);display:flex;align-items:center;gap:4px;}
  .seg-thumb .state.ok{background:rgba(5,150,105,.9);}
  .seg-thumb .state.warn{background:rgba(180,83,9,.92);}
  .seg-thumb .state.run{background:rgba(37,99,235,.92);}
  .seg-thumb .state .mini-spin{width:9px;height:9px;border:1.5px solid rgba(255,255,255,.4);border-top-color:#fff;
                               border-radius:50%;animation:spin .8s linear infinite;}
  .seg-thumb .cut{position:absolute;right:5px;top:5px;border-radius:4px;padding:0 5px;font-size:10px;
                  line-height:16px;background:rgba(0,0,0,.72);color:#fff;}
  .seg-thumb .playico{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);
                      color:#18181b;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .seg-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seg-sub{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted-fg);}
  .seg-sub .st-dot{width:5px;height:5px;border-radius:50%;background:#d4d4d8;display:inline-block;margin-right:4px;}
  .seg-sub .st-dot.ok{background:var(--green);}
  .seg-sub .st-dot.run{background:var(--blue);}

  /* generate result */
  .result-card{overflow:hidden;}
  .result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;
               padding:13px 16px;border-bottom:1px solid var(--border);}
  .result-body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);gap:14px;padding:14px;}
  .result-video{position:relative;aspect-ratio:16/9;max-height:360px;border-radius:12px;overflow:hidden;
                background:#0b0b0c;display:flex;align-items:center;justify-content:center;color:#a1a1aa;}
  .result-video .grad{position:absolute;inset:0;}
  .result-video .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.45));}
  .result-video.is-empty{aspect-ratio:auto;min-height:220px;height:100%;}
  .result-video.is-empty .grad{opacity:.18;filter:saturate(.5);}
  .result-video.is-empty .veil{background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.72));}
  .result-video .play{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);
                      color:#18181b;display:flex;align-items:center;justify-content:center;cursor:pointer;
                      box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .result-video .empty{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;
                       padding:0 20px;text-align:center;font-size:12px;line-height:1.7;color:#e4e4e7;}
  .result-video .tl{position:absolute;left:10px;bottom:9px;z-index:1;color:#fff;font-size:11px;font-family:var(--mono);
                    background:rgba(0,0,0,.45);border-radius:5px;padding:1px 6px;}
  .result-video .dur{position:absolute;right:10px;bottom:9px;z-index:1;color:#fff;font-size:11px;font-family:var(--mono);
                     background:rgba(0,0,0,.45);border-radius:5px;padding:1px 6px;}
  .result-video .stale{position:absolute;left:10px;top:10px;z-index:1;border-radius:5px;padding:1px 7px;
                       background:rgba(180,83,9,.94);color:#fff;font-size:10.5px;}
  .result-side{display:flex;flex-direction:column;gap:10px;min-width:0;}
  .side-block{border:1px solid var(--border);border-radius:10px;padding:10px 11px;}
  .side-label{display:flex;align-items:center;justify-content:space-between;gap:8px;
              font-size:11.5px;font-weight:600;color:#3f3f46;margin-bottom:8px;}
  .video-tools{display:flex;flex-wrap:wrap;gap:6px;}
  .frame-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .frame-item{border:1px solid var(--border);border-radius:8px;padding:5px;background:#fafafa;}
  .frame-thumb{position:relative;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:#0b0b0c;}
  .frame-thumb .grad{position:absolute;inset:0;}
  .frame-kind{position:absolute;left:4px;top:4px;border-radius:4px;padding:0 4px;background:rgba(0,0,0,.62);
              color:#fff;font-size:9.5px;line-height:15px;}
  .frame-time{position:absolute;right:4px;bottom:3px;color:#fff;font-size:9px;font-family:var(--mono);
              text-shadow:0 1px 2px #000;}
  .frame-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 2px 3px;
              font-size:10.5px;color:var(--muted-fg);}
  .frame-actions{display:flex;flex-wrap:wrap;gap:4px;padding:0 2px 2px;}
  .frame-actions .chip-btn{font-size:10px;padding:1px 5px;}
  .qc-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11.5px;}
  .qc-line b{font-weight:500;color:var(--green);}
  .param-summary{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:11px;color:var(--muted-fg);}
  .param-summary div{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .param-summary b{font-weight:500;color:#3f3f46;}
  .prompt-state{margin-top:8px;border-top:1px dashed var(--border);padding-top:7px;font-size:10.5px;
                color:var(--muted-fg);display:flex;align-items:center;gap:5px;}
  .prompt-state .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto;}
  .prompt-state.edited{color:var(--amber);}

      prompt: '1990年代中国乡村黄昏，田野与村口的交界。收工的人群扛着农具走在田埂上，远处炊烟升起<Picture 1>。母亲牵着8岁男孩<Picture 2>的手，两人背影慢慢走进村口。镜头先是大全景，再跟到中景，最后切到屋内昏黄的灯泡被拉亮。整体色调温暖、质朴，带一点旧照片的颗粒感。',
      frames: [
        { kind: 'first', adopted: false },
        { kind: 'last', adopted: true }
      ],
      snapshot: null
    }
  ];
  // 编译原文用于「一键还原」；已生成段落的提示词记为「上次提交」，用于显示是否被改过
  segments.forEach((s) => {
    s.originalPrompt = s.prompt;
    if (s.video) s.snapshot = s.prompt;
  });

  let activeTab = location.hash === '#preview' ? 'preview' : 'generate';
  let currentId = 's3';
  let openPopover = null;
  let toastTimer = null;

  const byId = (id) => segments.find((s) => s.id === id);
  const current = () => byId(currentId);
  const fmt = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  const clipRange = (seg) => {
    const i = segments.findIndex((s) => s.id === seg.id);
    const start = segments.slice(0, i).reduce((a, s) => a + s.dur, 0);
    return `${fmt(start)}–${fmt(start + seg.dur)}`;
  };
  const esc = (str) => String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- toast ---------- */
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ---------- popover ---------- */
  function closePopover() {
    if (openPopover) { openPopover.el.remove(); openPopover = null; }
  }
  function showPopover(anchor, html, align = 'left') {
    closePopover();
    const el = document.createElement('div');
    el.className = 'popover';
    el.innerHTML = html;
    document.body.appendChild(el);
    const r = anchor.getBoundingClientRect();
    const pw = el.offsetWidth, ph = el.offsetHeight;
    let left = align === 'right' ? r.right - pw : r.left;
    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
    let top = r.top - ph - 8;
    if (top < 8) top = Math.min(r.bottom + 8, window.innerHeight - ph - 8);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    openPopover = { el, anchor };
  }
  document.addEventListener('click', (e) => {
    if (openPopover && !openPopover.el.contains(e.target) && !e.target.closest('[data-act="seg-menu"], [data-act^="menu-"]')) {
      closePopover();
    }
  }, true);
  window.addEventListener('resize', closePopover);

  /* ---------- composer ---------- */
  const promptsEdited = new Set();

  function renderComposer() {
    const seg = current();
    const dirty = seg.prompt !== seg.snapshot && seg.prompt !== seg.originalPrompt;
    document.getElementById('segChipLabel').textContent = `${seg.scene} · 第${seg.index}段`;
    document.getElementById('segMeta').textContent = `${seg.shots} 镜 · ${seg.dur.toFixed(1)}s · ${seg.title}`;
    document.getElementById('clipTime').textContent = clipRange(seg);
    document.getElementById('clipTitle').textContent = seg.title;

    document.getElementById('refsRow').innerHTML = seg.refs.map((r, i) => `
      <div class="ref" title="${esc(r.label)}（图${i + 1}）" data-act="preview-ref" data-index="${i}">
        <span class="ph" style="background:${grad(r.g)}"></span>
        <span class="num">${i + 1}</span>
        <button class="del" data-act="remove-ref" data-index="${i}" title="移除这张参考图">×</button>
      </div>
    `).join('') + `
      <button class="addref" data-act="add-ref" title="添加参考图">+</button>
      <div class="refs-note">
        <b>参考图 · 图1 起按顺序上传</b>
        <span>${seg.refs.length} / 14 张 · 点右上角 × 移除</span>
      </div>
    `;

    const params = document.getElementById('paramsRow');
    params.innerHTML = `
      <button class="param" data-act="menu-refs">
        <svg class="ic sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>
        参考图 ${seg.refs.length}
      </button>
      <button class="param" data-act="menu-ratio">
        <svg class="ic sm" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
        ${seg.ratio}
        <svg class="ic sm caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="param" data-act="menu-duration">
        <svg class="ic sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        ${seg.dur}s
        <svg class="ic sm caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="param" data-act="menu-count">
        <svg class="ic sm" viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5"/></svg>
        ${seg.count} 条
        <svg class="ic sm caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="param" data-act="menu-more">
        <svg class="ic sm" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        更多
      </button>
    `;

    const ta = document.getElementById('promptInput');
    if (document.activeElement !== ta || ta.dataset.seg !== seg.id) {
      ta.value = seg.prompt;
      ta.dataset.seg = seg.id;
    }
    updateComposerChrome();
  }

  function updateComposerChrome() {
    const seg = current();
    const ta = document.getElementById('promptInput');
    const dirty = ta.value !== seg.originalPrompt;
    const restore = document.getElementById('restoreBtn');
    restore.disabled = !dirty;
    restore.classList.toggle('dirty', dirty);

    document.getElementById('sendLabel').textContent =
      seg.status === 'running' ? '生成中' : (seg.video ? '重新生成' : '发送');
    const send = document.getElementById('sendBtn');
    send.disabled = seg.status === 'running';

    const changedSince = seg.snapshot && ta.value !== seg.snapshot;
    const line = document.getElementById('submitLine');
    line.className = 'submit-line show' + (seg.status === 'running' ? ' running' : changedSince ? ' warn' : (seg.video ? ' done' : ''));
    let text = '';
    if (seg.status === 'running') {
      text = `正在提交第${seg.index}段 · ${seg.dur}s · ${seg.ratio} · 参考图 ${seg.refs.length} 张`;
    } else if (changedSince) {
      text = '提示词已修改，当前视频仍对应上次提交的版本；需要时点「重新生成」。';
    } else if (seg.video) {
      text = seg.stale
        ? '已回传视频，但分镜内容改过，视频已过期；建议重新生成。'
        : `已生成 · 上次提交 ${seg.ratio} · ${seg.dur}s · 参考图 ${seg.refs.length} 张`;
    } else {
      text = '尚未生成。发送后按当前提示词与参数提交，进度见上方结果与底部列表。';
    }
    if (document.getElementById('submitText')) document.getElementById('submitText').textContent = text;
    const viewBtn = document.getElementById('viewResultBtn');
    if (viewBtn) viewBtn.style.display = seg.video ? '' : 'none';
    document.getElementById('finalTag').textContent = dirty ? '已编辑 · 提交以此为准' : '最终提交内容';
    const promptState = document.getElementById('promptState');
    if (promptState) {
      promptState.classList.toggle('edited', dirty);
      promptState.innerHTML = `<span class="dot"></span>${dirty ? '提示词已编辑 · 提交以输入框为准' : '提示词与编译原文一致'}`;
    }
    document.getElementById('previewCount').textContent = `${segments.filter((s) => s.video).length}/${segments.length}`;
    if (line.classList.contains('warn')) line.classList.add('warn');
  }

  /* ---------- segment picker ---------- */
  function openSegMenu(anchor) {
    const rows = segments.map((s) => `
      <button class="pop-item" data-act="pick-seg" data-id="${s.id}">
        <span class="mini-thumb" style="background:${grad(s.refs[0]?.g ?? 0)}"></span>
        <span>
          ${esc(s.scene)} · 第${s.index}段
          <span class="sub">${esc(s.title)} · ${s.shots} 镜 · ${s.dur}s${s.video ? ' · 已回传' : ''}</span>
        </span>
        ${s.id === currentId ? `<svg class="ic sm check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>` : ''}
      </button>
    `).join('');
    showPopover(anchor, `<div class="pop-hd"><b>切换段落</b><span>${segments.length} 段</span></div>${rows}`);
  }

  /* ---------- menus ---------- */
  function openRefsMenu(anchor) {
    const seg = current();

      </div>

    showPopover(anchor, `
      <div class="pop-hd"><b>参考图</b><span>${seg.refs.length} / 14</span></div>

  function openDurationMenu(anchor) {
    const seg = current();
    const opts = [[5, '适合快切'], [8, '常规短镜'], [10, '本段编译建议'], [15, '长镜头']];
    showPopover(anchor, `<div class="pop-hd"><b>生成时长</b><span>参考 ${seg.shots} 镜</span></div>` + opts.map(([v, sub]) => `

  }

  function openCountMenu(anchor) {
    const seg = current();
    popoverCount(seg, anchor);
  }
  function popoverCount(seg, anchor) {
    const opts = [[1, '先出 1 条'], [2, '对比 2 条'], [4, '多抽 4 条']];
    showPopover(anchor, `<div class="pop-hd"><b>生成条数</b></div>` + opts.map(([v, sub]) => `
      <button class="pop-item" data-act="set-count" data-value="${v}">

      </button>`).join(''));
  }

  function openMoreMenu(anchor) {
    showPopover(anchor, `
      <div class="pop-hd"><b>更多操作</b><span>本段</span></div>
      <button class="pop-item" data-act="more-cloud-start">

      </button>
      <button class="pop-item" data-act="more-regenerate">
        <span>重新生成本段分镜<span class="sub">只重写本段，前后段保留</span></span>
      </button>
      <button class="pop-item" data-act="more-restore-seg">
        <span>复原本段分镜<span class="sub">回到生成时的分镜内容</span></span>
      </button>
      <div class="pop-sep"></div>
      <button class="pop-item" data-act="more-blocking">
        <span>编辑站位（高级）<span class="sub">轴线与人物站位，会进入提示词</span></span>
      </button>
      <button class="pop-item" data-act="more-recompile">

      </button>
      <button class="pop-item" data-act="more-body">
        <span>查看分镜编译正文<span class="sub">只读，用于核对提示词来源</span></span>
      </button>
      <div class="pop-note">高级操作收在这里，避免占满提交区；重新编译会覆盖输入框为新的编译原文。</div>
    `, 'right');
  }

  /* ---------- send / restore ---------- */
  function send() {
    const seg = current();
    if (seg.status === 'running') return;
    const ta = document.getElementById('promptInput');
    if (!ta.value.trim()) { toast('提示词为空，无法提交'); return; }
    seg.prompt = ta.value;
    seg.status = 'running';
    renderAll();
    toast(`已提交：${seg.scene} 第${seg.index}段 · ${seg.dur}s · ${seg.ratio} · 参考图 ${seg.refs.length} 张`);
    setTimeout(() => {
      seg.status = 'idle';
      seg.video = true;
      seg.stale = false;
      seg.snapshot = seg.prompt;
      renderAll();
      toast(`第${seg.index}段生成完成（原型模拟，已回填生成结果）`);
    }, 2200);
  }

  function restore() {
    const seg = current();
    const ta = document.getElementById('promptInput');
    ta.value = seg.originalPrompt ?? seg.compileSource ?? seg.prompt;
    seg.prompt = ta.value;
    updateComposerChrome();
    closePopover();
    toast('已还原为分镜编译出的原始提示词');
  }

  /* ---------- generate result ---------- */
  function renderResult() {
    const seg = current();
    const frames = seg.frames ?? [];
    const running = seg.status === 'running';

      const isLast = f.kind === 'last';
      return `
        <div class="frame-item">
          <div class="frame-thumb">
            <span class="grad" style="background:${grad((seg.refs[0]?.g ?? 0) + (isLast ? 3 : 0))}"></span>

            <span class="frame-time">${isLast ? `${seg.dur}.0s` : '00:00.0'}</span>
          </div>
          <div class="frame-meta">
            <span>${isLast ? '尾帧' : '首帧'}</span>
            <span>${isLast ? (f.adopted ? '已接下一段' : '候选尾帧') : '本段图1'}</span>
          </div>

            ? `<span class="play" data-act="mock" data-msg="播放第${seg.index}段视频（原型占位）">▶</span>
               <span class="tl">${esc(seg.title)}</span>

               ${seg.stale ? '<span class="stale">分镜已改，视频过期</span>' : ''}`

                 <svg class="ic" style="width:22px;height:22px" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3Z"/></svg>
                 ${running
                   ? `正在生成第${seg.index}段…<br/>完成后自动回填到这里`
                   : `该段尚未生成视频<br/>发送下方提示词，或回传已有视频`}
               </span>`}
        </div>
        <div class="result-side">
          <div class="side-block">
            <div class="side-label">
              视频与截帧
              <span class="muted mono" style="font-size:10.5px">v3 · ${seg.ratio}</span>
            </div>
            <div class="video-tools">

            </div>

                <button class="chip-btn" data-act="go-preview">查看分镜</button>

            </div>

  }

  /* ---------- read-only shots ---------- */
  function renderShots() {

      <div class="shots-body">
        <details class="blocking-fold">
          <summary>本场站位与轴线</summary>
          <p>${esc(blocking)}</p>
        </details>
        <div class="shots-grid">${shotsHtml}</div>
      </div>
    `;
  }

  /* ---------- persistent segment strip ---------- */
  function renderStrip() {
    document.getElementById('returnedBadge').textContent =
      `已回传 ${segments.filter((s) => s.video).length} / ${segments.length}`;

    document.getElementById('segStrip').innerHTML = segments.map((s) => {
      const active = s.id === currentId;
      const running = s.status === 'running';
      const state = running
        ? `<span class="state run"><span class="mini-spin"></span>生成中</span>`
        : s.video
          ? `<span class="state ok">已回传</span>`
          : `<span class="state">未回传</span>`;
      return `
        <div class="seg-card ${active ? 'active' : ''}" data-act="pick-seg" data-id="${s.id}">
          <div class="seg-thumb">
            <span class="grad" style="background:${grad(s.refs[0]?.g ?? 0)}"></span>
            <span class="veil"></span>
            ${s.video && !running ? '<span class="playico">▶</span>' : ''}
            ${state}
            ${s.hard && s.index > 1 ? '<span class="cut">硬切</span>' : ''}
          </div>
          <div class="seg-name">${esc(s.scene)} · 第${s.index}段</div>
          <div class="seg-sub">
            <span><span class="st-dot ${s.video ? 'ok' : running ? 'run' : ''}"></span>${s.shots} 镜 · ${s.dur}s</span>
            <span>${s.stale ? '<span style="color:var(--amber)">已过期</span>' : s.video ? 'QC 通过' : '待生成'}</span>
          </div>
        </div>`;
    }).join('');
  }

  function renderTabs() {
    document.querySelectorAll('[data-tab]').forEach((b) => {
      b.classList.toggle('active', b.dataset.tab === activeTab);
    });
    document.getElementById('generatePanel').hidden = activeTab !== 'generate';
    document.getElementById('previewPanel').hidden = activeTab !== 'preview';
    document.getElementById('tabHelp').textContent = activeTab === 'generate'
      ? '提交内容以输入框内的提示词为准 · 高级操作收在「更多」里'
      : '只读查看本段分镜 · 底部段落列表始终保留';
    document.getElementById('previewCount').textContent =
      `${segments.filter((s) => s.video).length}/${segments.length}`;
  }

  function renderAll() {
    renderTabs();
    renderComposer();
    renderResult();
    renderShots();
    renderStrip();
  }

  function selectSegment(id) {
    currentId = id;
    closePopover();
    renderAll();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) {
      activeTab = tabBtn.dataset.tab;
      closePopover();
      renderAll();
      return;
    }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    switch (act) {
      case 'seg-menu':
        openSegMenu(el); break;
      case 'pick-seg':
        selectSegment(el.dataset.id); break;
      case 'menu-refs':
        openRefsMenu(el); break;
      case 'menu-ratio':
        openRatioMenu(el); break;
      case 'menu-duration':
        openDurationMenu(el); break;
      case 'menu-count':
        openCountMenu(el); break;
      case 'menu-more':
        openMoreMenu(el); break;
      case 'remove-ref': {
        e.stopPropagation();
        const seg = current();
        const idx = Number(el.dataset.index);
        seg.refs.splice(idx, 1);
        closePopover();
        renderAll();
        toast(`已移除参考图，剩余 ${seg.refs.length} 张`);
        break;
      }
      case 'add-ref': {
        e.stopPropagation();
        const seg = current();
        if (seg.refs.length >= 14) { toast('参考图最多 14 张'); break; }
        seg.refs.push({ label: `新参考图 ${seg.refs.length + 1}`, g: seg.refs.length + 1 });
        closePopover();
        renderAll();
        toast('已添加参考图，请按图号顺序上传');
        break;
      }
      case 'set-ratio': {
        current().ratio = el.dataset.value;
        closePopover();
        renderAll();
        toast(`画面比例已设为 ${el.dataset.value}`);
        break;
      }
      case 'set-duration': {
        current().dur = Number(el.dataset.value);
        closePopover();
        renderAll();
        break;
      }
      case 'set-count': {
        current().count = Number(el.dataset.value);
        closePopover();
        renderComposer();
        break;
      }
      case 'more-cloud-start':
        closePopover();
        toast('云端生成起始画面（高级操作，原型占位）');
        break;
      case 'more-regenerate':
        closePopover();
        toast('重新生成本段分镜：只重写本段，前后段保留');
        break;
      case 'more-restore-seg':
        closePopover();
        toast('已复原本段分镜（原型模拟）');
        break;
      case 'more-blocking':
        closePopover();
        toast('打开站位编辑弹窗（原型占位）');
        break;
      case 'more-recompile': {
        closePopover();
        const seg = current();
        seg.prompt = seg.originalPrompt;
        const ta = document.getElementById('promptInput');
        ta.value = seg.prompt;
        ta.dataset.seg = seg.id;
        updateComposerChrome();
        toast('已按当前分镜与参考图重新编译提示词');
        break;
      }
      case 'more-body':
        closePopover();
        toast('查看分镜编译正文（原型未接入弹层）');
        break;
      case 'restore':
        restore(); break;
      case 'send':
        send(); break;
      case 'go-preview':
        activeTab = 'preview';
        renderAll();
        break;
      case 'go-generate':
        activeTab = 'generate';
        renderAll();
        break;
      case 'upload-video': {
        const seg = current();
        seg.video = true;
        seg.stale = false;
        seg.snapshot = seg.prompt;
        seg.frames = [{ kind: 'first', adopted: false }, { kind: 'last', adopted: false }];
        renderAll();
        toast('视频已回传（原型模拟）');
        break;
      }
      case 'remove-video': {
        const seg = current();
        seg.video = false;
        seg.stale = false;
        seg.frames = [];
        renderAll();
        toast('已移除本段视频');
        break;
      }
      case 'extract-first':
      case 'extract-last': {
        const seg = current();
        if (!seg.video) { toast('请先回传视频再截帧'); break; }
        const kind = act === 'extract-first' ? 'first' : 'last';
        const rest = (seg.frames ?? []).filter((f) => f.kind !== kind);
        seg.frames = kind === 'first'
          ? [{ kind: 'first', adopted: false }, ...rest]
          : [...rest.filter((f) => f.kind === 'first'), { kind: 'last', adopted: false }];
        renderAll();
        toast(kind === 'first' ? '首帧已提取' : '尾帧已提取');
        break;
      }
      case 'frame-anchor': {
        const seg = current();
        const last = (seg.frames ?? []).find((f) => f.kind === 'last');
        if (last) last.adopted = true;
        renderResult();
        toast('已设为下一段起始画面（原型模拟）');
        break;
      }
      case 'frame-download':
        toast('下载截帧（原型占位）');
        break;
      case 'recheck':
        toast('正在重新质检本段（原型占位）');
        break;
      case 'preview-ref':
        toast(`打开参考图预览：图${Number(el.dataset.index) + 1}`);
        break;
      case 'mock':
        toast(el.dataset.msg || '原型占位');
        break;
    }
  });

  const ta = document.getElementById('promptInput');
  ta.addEventListener('input', () => {
    const seg = current();
    seg.prompt = ta.value;
    updateComposerChrome();
  });
  ta.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      send();
    }
  });

  renderAll();
</script>
</body>
</html>
